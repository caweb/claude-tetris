name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
        with:
          claude_args: |
             --max-turns 30
             --allowedTools "Bash(gh pr create:*),Bash(git push:*)"
             --append-system-prompt "Cuando termines de hacer cambios y hacer push a la rama, abre tú mismo el Pull Request usando 'gh pr create' con un título y descripción claros, en vez de solo dejar un link para crearlo manualmente."
