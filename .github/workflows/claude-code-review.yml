name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
        with:
          prompt: |
            Revisa este pull request y deja comentarios sobre:
            - Posibles bugs o errores lógicos
            - Problemas de seguridad
            - Estilo y buenas prácticas
            - Sugerencias de mejora concretas
            Sé breve y directo, en español.
          claude_args: "--max-turns 30"
